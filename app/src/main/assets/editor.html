<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NoteFlow Editor</title>
<link rel="stylesheet" href="codemirror.min.css">
<script src="codemirror.min.js"></script>
<script src="markdown.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #131313; height: 100vh; overflow: hidden; }
  .CodeMirror {
    height: 100vh;
    background: #131313;
    color: #FFFFFF;
    font-size: 16px;
    line-height: 1.6;
    direction: rtl;
    font-family: -apple-system, sans-serif;
  }
  .CodeMirror-cursor { border-left: 2px solid #CABEFF; }
  .CodeMirror-selected { background: #2A2A2A; }
  .CodeMirror-scroll { padding: 16px; }
  .CodeMirror-placeholder { color: rgba(200,197,205,0.4) !important; }
</style>
</head>
<body>
<textarea id="editor"></textarea>
<script>
  var cm = CodeMirror.fromTextArea(document.getElementById("editor"), {
    mode: "markdown",
    theme: "default",
    lineWrapping: true,
    autofocus: true,
    placeholder: "واصل افكارك...",
    rtlMoveVisually: true,
    extraKeys: {}
  });

  cm.on("change", function() {
    if (window.NoteFlowBridge) {
      window.NoteFlowBridge.onContentChanged(cm.getValue());
    }
  });

  function setContent(text) {
    cm.setValue(text);
    cm.setCursor(cm.lineCount(), 0);
  }

  function getContent() {
    return cm.getValue();
  }

  function focusEditor() {
    cm.focus();
  }
</script>
</body>
</html>
